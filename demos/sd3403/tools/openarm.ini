[arm]
active_joint_mask = 0xff

[can]
; the CAN bus each arm is wired to (spi0 or spi2, one each); swap the
; two if the arm cables are the other way round
right = spi0
left = spi2
; CAN FD transmitter delay compensation offset of both buses, x 25 ns
; (0..63); 6 = the 5 Mbit/s data-phase sample point
tdco = 6

[joints]
j1 = true
j2 = true
j3 = true
j4 = true
j5 = true
j6 = true
j7 = true
; gripper = motor 8 (bit 7 of active_joint_mask)
gripper = true

[gravity]
j1_gravity_scale = 1.20
j1_gravity_offset = 0.0

[inertia]
j1_inertia_damping = 0.20
j1_inertia_capture = 0.05
